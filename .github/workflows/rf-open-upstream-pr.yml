name: Open upstream PR

on:
  issue_comment:
    types: [created]

jobs:
  open-upstream-pr:
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/upstream-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Get PR branch name
        id: pr-info
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('branch', pr.head.ref);

      - name: Set up git repo
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git config user.name "${{ github.event.comment.user.login }}"
          git config user.email "${{ github.event.comment.user.login }}@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin master --depth=1 --filter=blob:none
          git fetch origin master-rf --depth=50 --filter=blob:none
          git fetch origin ${{ steps.pr-info.outputs.branch }} --depth=50 --filter=blob:none
          git checkout master-rf

      - name: Derive upstream branch name
        id: derive
        run: |
          CURRENT="${{ steps.pr-info.outputs.branch }}"
          STRIPPED="${CURRENT#rf/}"
          UPSTREAM="feat/${STRIPPED}"
          echo "upstream_branch=$UPSTREAM" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream branch if exists
        run: |
          git fetch origin "${{ steps.derive.outputs.upstream_branch }}" --depth=50 --filter=blob:none 2>/dev/null || true

      - name: Find existing upstream PR
        id: existing-pr
        uses: actions/github-script@v8
        with:
          script: |
            const branch = '${{ steps.derive.outputs.upstream_branch }}';
            const { data: prs } = await github.rest.pulls.list({
              owner: 'Azure',
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (prs.length > 0) {
              core.info(`Found existing open PR #${prs[0].number}: ${prs[0].html_url}`);
              core.setOutput('pr_url', prs[0].html_url);
              core.setOutput('pr_number', String(prs[0].number));
            } else {
              core.setOutput('pr_url', '');
              core.setOutput('pr_number', '');
            }

      - name: Cherry-pick commits onto upstream branch
        id: cherry-pick
        run: |
          chmod +x rf-scripts/lib/cherry-pick-to-upstream.sh
          STATUS_FILE=$(mktemp)
          set +e
          COMMIT_LIST=$(./rf-scripts/lib/cherry-pick-to-upstream.sh \
            "${{ steps.pr-info.outputs.branch }}" \
            "${{ steps.derive.outputs.upstream_branch }}" \
            "$STATUS_FILE")
          EXIT_CODE=$?
          set -e
          echo "$COMMIT_LIST"
          if [[ -f "$STATUS_FILE" ]]; then
            cat "$STATUS_FILE" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$STATUS_FILE"
          # Make commit list available to later steps (escape for multiline)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "commit_list<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMIT_LIST" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Comment on failure
        if: failure() && steps.cherry-pick.conclusion == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '`/upstream-pr` failed — cherry-pick conflict.',
                '',
                'Please run the script locally to resolve:',
                '```',
                './rf-scripts/upstream-pr.sh',
                '```',
              ].join('\n'),
            });

      - name: Push upstream branch
        id: push
        if: success() && steps.cherry-pick.outputs.NO_CHANGES != 'true'
        run: |
          PUSH_ARGS=(-u origin "${{ steps.derive.outputs.upstream_branch }}")
          if [[ "${{ steps.cherry-pick.outputs.NEEDS_FORCE }}" == "true" ]]; then
            PUSH_ARGS=(--force-with-lease "${PUSH_ARGS[@]}")
          fi
          TMP_FILE=$(mktemp)
          git push "${PUSH_ARGS[@]}" 2>&1 | tee "$TMP_FILE"
          EXIT_CODE=${PIPESTATUS[0]}
          OUTPUT=$(cat "$TMP_FILE")
          rm -f "$TMP_FILE"
          PR_URL=$(echo "$OUTPUT" | grep -oE "https://github.com/.+/.+/pull/new/[^[:space:]]+" || true)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Comment already up to date
        if: success() && steps.cherry-pick.outputs.NO_CHANGES == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '`/upstream-pr` — upstream branch `${{ steps.derive.outputs.upstream_branch }}` is already up to date. Nothing to push.',
            });

      - name: Comment success and close PR
        if: success() && steps.cherry-pick.outputs.NO_CHANGES != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const upstreamBranch = '${{ steps.derive.outputs.upstream_branch }}';
            const newPrUrl = '${{ steps.push.outputs.pr_url }}';
            const existingPrUrl = '${{ steps.existing-pr.outputs.pr_url }}';
            const existingPrNumber = '${{ steps.existing-pr.outputs.pr_number }}';
            const commitList = `${{ steps.cherry-pick.outputs.commit_list }}`;
            const neededForce = '${{ steps.cherry-pick.outputs.NEEDS_FORCE }}' === 'true';

            // Prefer existing open PR; fall back to new PR creation URL or compare link
            let prLink;
            if (existingPrUrl) {
              const suffix = neededForce ? ' (updated with force-push)' : ' (updated)';
              prLink = `[View existing PR #${existingPrNumber} towards Microsoft](${existingPrUrl})${suffix}`;
            } else if (newPrUrl) {
              prLink = `[Open PR towards Microsoft](${newPrUrl})`;
            } else {
              prLink = `https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${upstreamBranch}`;
            }

            const body = [
              '`/upstream-pr` succeeded. :rocket:',
              '',
              `**Upstream branch:** [${upstreamBranch}](https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${upstreamBranch})`,
              `**Next steps:** ${prLink}`,
              '',
              '**Cherry-picked commits:**',
              commitList.split('\n').map(l => `- ${l}`).join('\n'),
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
